name: 问题反馈
description: 反馈 App 或网站中可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助我们改进 Daily Quote。请不要提交姓名、邮箱或其他个人敏感信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要说明发生了什么。
      placeholder: 例如：点击“保存或分享”后没有出现系统分享面板。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开“今日”页面
        2. 点击分享按钮
        3. 点击“保存或分享”
        4. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 说明你原本期望看到的结果。
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可直接拖入图片或视频；请先遮盖通知、姓名等私人信息。
  - type: input
    id: app-version
    attributes:
      label: App 版本
      placeholder: 例如：1.0 (1)
  - type: input
    id: environment
    attributes:
      label: 设备与系统版本
      placeholder: 例如：iPhone 16 Pro，iOS 26.0
  - type: dropdown
    id: appearance
    attributes:
      label: 外观模式
      options:
        - 跟随系统
        - 浅色
        - 深色
        - 不确定 / 不适用
  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 可补充是否稳定复现、是否与字体大小或语言设置有关。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认附件和描述中不包含个人敏感信息。
          required: true
